name: Release
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'package.json'

jobs:
  build:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify agent release downloads and package contents
        run: |
          npm pack --dry-run --json --ignore-scripts > "$RUNNER_TEMP/meshcentral-package.json"
          node agents/check-releases.js --package "$RUNNER_TEMP/meshcentral-package.json"
      - name: Release
        uses: SerenModz21/github-action-npm-release@master
        id: release
      - name: Print release output
        if: ${{ steps.release.outputs.released == 'true' }}
        run: echo Release ID ${{ steps.release.outputs.release_id }}
      - name: Trigger Docker builds
        if: ${{ steps.release.outputs.released == 'true' }}
        run: |
          gh workflow run docker-alpine.yml -r ${{ steps.release.outputs.release_tag }}
          gh workflow run docker-debian.yml -r ${{ steps.release.outputs.release_tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
